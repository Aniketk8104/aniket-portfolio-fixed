# =============================================================================
# LEGACY ASSET DISPOSITION
# =============================================================================
# public/blog/hire-mern-stack-developer-checklist.html
#   Decision: DELETE + 301 redirect to /writing
#   Rationale: The page was entirely positioned around "Freelance MERN Stack
#   Developer" services and cannot be rebranded to engineering content. It
#   contained the prohibited strings "Freelance MERN", "MERN Stack Developer",
#   and "Hire MERN" throughout its copy, JSON-LD, and meta tags. Redirecting to
#   /writing preserves any inbound link equity by routing visitors to the new
#   Writing index, which is the closest relevant destination.
#   Validates: Requirements 14.5, 20.2
# =============================================================================

[build]
  # Build command
  command = "npm ci && npm run build"
  
  # Publish directory (Vite outputs to 'dist' by default)
  publish = "dist"

[build.environment]
  # Ensure proper Node.js version
  NODE_VERSION = "18"
  
  # Use npm ci for faster, reliable builds
  NPM_FLAGS = "--production=false"
  
  # Optional: Set CI environment
  CI = "true"

# 301 redirect: legacy freelance MERN blog post → new Writing index
# (file deleted as part of engineering rebrand; see top-of-file comment)
[[redirects]]
  from = "/blog/hire-mern-stack-developer-checklist"
  to = "/writing"
  status = 301
  force = true

[[redirects]]
  from = "/blog/hire-mern-stack-developer-checklist.html"
  to = "/writing"
  status = 301
  force = true

# =============================================================================
# SPA FALLBACK — static-asset pass-throughs come first so they are never
# rewritten to /index.html; catch-all is last.
# Validates: Requirements 17.1, 17.2, 17.3
# =============================================================================

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

# Catch-all SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for better performance and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "accelerometer=(), camera=(), microphone=(), geolocation=(), gyroscope=(), magnetometer=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Robots-Tag = "all"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://api.formspree.io https://www.google-analytics.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
