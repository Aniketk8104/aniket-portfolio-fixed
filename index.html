<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons and Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="application-name" content="Aniket Kushwaha — Engineering Portfolio" />

    <!-- Per-page SEO. scripts/prerender-seo.mjs replaces everything between the
         seo markers at build time with tags from src/app/SEO (one HTML file per
         URL); this copy is only the dev-server fallback. -->
    <!-- seo:start -->
    <title>Aniket Kushwaha — Backend / Full-Stack Engineer</title>
    <meta
      name="description"
      content="Aniket Kushwaha, Backend / Full-Stack Engineer in Navi Mumbai. Primary engineer on 5 production platforms: multi-tenant SaaS, CRM, HRMS, teleradiology and commerce."
    />
    <!-- seo:end -->

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Critical CSS inline -->
    <style>
      :root {
        --primary-bg: #08090c;
        --text-primary: #fafafa;
        --text-secondary: #a1a1aa;
      }

      body {
        margin: 0;
        background: var(--primary-bg);
        color: var(--text-primary);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      /* Prevent CLS for hero title */
      .hero-title {
        font-size: clamp(2.5rem, 6vw, 4.25rem);
        font-weight: 800;
        line-height: 1.08;
        letter-spacing: -0.02em;
      }

      /* Loading screen styles */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #08090c;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }

    </style>

  </head>
  <body itemscope itemtype="https://schema.org/WebPage">
    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div id="root">
      <!-- Initial loading state to prevent CLS -->
      <div class="loading-screen">
        <div style="text-align: center">
          <div
            style="font-size: 3rem; font-weight: 800; color: #818cf8; letter-spacing: -0.02em"
            aria-label="Loading Aniket Kushwaha — Engineering Portfolio"
          >
            AK
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
