<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="StopSearch — hiring dashboard preview">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="panel4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1019"/>
      <stop offset="1" stop-color="#090b12"/>
    </linearGradient>
    <pattern id="grid4" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>
  <rect width="800" height="500" fill="url(#grid4)"/>
  <rect x="64" y="70" width="672" height="360" rx="18" fill="url(#panel4)" stroke="#ffffff" stroke-opacity="0.1"/>
  <g transform="translate(88 98)">
    <circle cx="6" cy="6" r="6" fill="#ff5f56"/>
    <circle cx="26" cy="6" r="6" fill="#ffbd2e"/>
    <circle cx="46" cy="6" r="6" fill="#27ca3f"/>
  </g>
  <!-- search bar -->
  <rect x="96" y="140" width="556" height="46" rx="23" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="126" cy="163" r="10" fill="none" stroke="#93c5fd" stroke-width="3"/>
  <line x1="133" y1="170" x2="142" y2="179" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
  <rect x="160" y="156" width="180" height="14" rx="7" fill="#ffffff" fill-opacity="0.25"/>
  <!-- bar chart -->
  <g transform="translate(96 210)">
    <rect width="260" height="170" rx="12" fill="#ffffff" fill-opacity="0.05"/>
    <g transform="translate(28 150)">
      <rect x="0" y="-70" width="28" height="70" rx="5" fill="#6366f1"/>
      <rect x="44" y="-110" width="28" height="110" rx="5" fill="#818cf8"/>
      <rect x="88" y="-50" width="28" height="50" rx="5" fill="#6366f1"/>
      <rect x="132" y="-128" width="28" height="128" rx="5" fill="#93c5fd"/>
      <rect x="176" y="-90" width="28" height="90" rx="5" fill="#818cf8"/>
    </g>
  </g>
  <!-- candidate rows -->
  <g transform="translate(372 210)">
    <rect width="280" height="170" rx="12" fill="#ffffff" fill-opacity="0.05"/>
    <g fill="#3b82f6">
      <circle cx="34" cy="38" r="16" fill-opacity="0.7"/>
      <circle cx="34" cy="86" r="16" fill-opacity="0.55"/>
      <circle cx="34" cy="134" r="16" fill-opacity="0.4"/>
    </g>
    <g fill="#ffffff">
      <rect x="62" y="30" width="150" height="12" rx="6" fill-opacity="0.3"/>
      <rect x="62" y="50" width="90" height="10" rx="5" fill-opacity="0.18"/>
      <rect x="62" y="78" width="150" height="12" rx="6" fill-opacity="0.3"/>
      <rect x="62" y="98" width="90" height="10" rx="5" fill-opacity="0.18"/>
      <rect x="62" y="126" width="150" height="12" rx="6" fill-opacity="0.3"/>
      <rect x="62" y="146" width="90" height="10" rx="5" fill-opacity="0.18"/>
    </g>
  </g>
</svg>
