<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="BVISIONR — AI messaging SaaS preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15131f"/>
      <stop offset="1" stop-color="#0d0c14"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="64" y="70" width="672" height="360" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.1"/>
  <g transform="translate(88 98)">
    <circle cx="6" cy="6" r="6" fill="#ff5f56"/>
    <circle cx="26" cy="6" r="6" fill="#ffbd2e"/>
    <circle cx="46" cy="6" r="6" fill="#27ca3f"/>
  </g>
  <!-- chat bubbles -->
  <g transform="translate(96 150)">
    <rect width="260" height="40" rx="20" fill="#ffffff" fill-opacity="0.08"/>
    <rect y="56" width="200" height="40" rx="20" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="300" y="28" width="240" height="44" rx="22" fill="#7c3aed" fill-opacity="0.9"/>
    <rect x="340" y="92" width="200" height="40" rx="20" fill="#a855f7" fill-opacity="0.55"/>
    <rect y="120" width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.06"/>
  </g>
  <!-- routing nodes -->
  <g transform="translate(96 330)" stroke="#c4b5fd" stroke-opacity="0.7" stroke-width="2" fill="none">
    <path d="M0 30 L120 30 L200 0 M120 30 L200 60"/>
    <circle cx="0" cy="30" r="9" fill="#c4b5fd"/>
    <circle cx="200" cy="0" r="7" fill="#a855f7"/>
    <circle cx="200" cy="60" r="7" fill="#a855f7"/>
  </g>
  <text x="540" y="372" font-family="'JetBrains Mono',monospace" font-size="15" fill="#c4b5fd" letter-spacing="2">AI ROUTER · 99.9%</text>
</svg>
